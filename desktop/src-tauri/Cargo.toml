[package]
name = "font-builder-desktop-alpha"
version = "0.1.0-4"
description = "Cross-platform local font builder shell"
edition = "2021"

[lib]
name = "font_builder_desktop_alpha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
