<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Font Builder</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" data-i18n="eyebrow">LOKALNE NARZĘDZIE DO FONTÓW</p>
        <h1>Font Builder <span>α5</span></h1>
      </div>

      <div class="top-actions">
        <div class="lang-switch" aria-label="Language">
          <button class="lang-btn" data-lang="pl">PL</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button id="settings-open" class="icon-btn" aria-label="Settings" title="Settings">⚙</button>
      </div>
    </header>

    <nav class="stepper" aria-label="Progress">
      <button class="step-tab active" data-step="1" disabled>
        <span>01</span>
        <strong data-i18n="step.input">Dodaj</strong>
      </button>
      <div class="step-line"></div>
      <button class="step-tab" data-step="2" disabled>
        <span>02</span>
        <strong data-i18n="step.analysis">Sprawdź</strong>
      </button>
      <div class="step-line"></div>
      <button class="step-tab" data-step="3" disabled>
        <span>03</span>
        <strong data-i18n="step.download">Pobierz</strong>
      </button>
    </nav>

    <section id="view-input" class="view active">
      <div id="dropzone" class="dropzone">
        <div class="dropicon">Aa</div>
        <h2 data-i18n="drop.title">Upuść fonty albo ZIP tutaj</h2>
        <p data-i18n="drop.subtitle">TTF · OTF · WOFF · WOFF2 · ZIP · folder</p>

        <div class="drop-actions">
          <button id="pick-files" data-i18n="drop.pickFiles">Wybierz pliki / ZIP</button>
          <button id="pick-folder" class="secondary" data-i18n="drop.pickFolder">Wybierz folder</button>
        </div>
      </div>

      <div id="input-summary" class="input-summary empty">
        <span data-i18n="input.empty">Nic jeszcze nie dodano.</span>
      </div>

      <div class="bottom-actions">
        <button id="clear" class="secondary" data-i18n="input.clear">Wyczyść</button>
        <button id="analyze" disabled data-i18n="actions.analyze">ANALIZUJ</button>
      </div>
    </section>

    <section id="view-analysis" class="view">
      <div id="analysis-content" class="stage-card"></div>

      <div class="bottom-actions">
        <button id="back-input" class="secondary" data-i18n="actions.back">WSTECZ</button>
        <button id="build" data-i18n="actions.build">ZBUDUJ FONT ZMIENNY</button>
      </div>
    </section>

    <section id="view-result" class="view">
      <div id="result-content" class="stage-card"></div>

      <div class="bottom-actions">
        <button id="new-build" class="secondary" data-i18n="actions.newBuild">NOWY BUILD</button>
        <button id="save-zip" data-i18n="actions.saveZip">POBIERZ ZIP</button>
      </div>
    </section>

    <section id="overlay" class="overlay hidden">
      <div class="spinner"></div>
      <strong id="overlay-text"></strong>
    </section>

    <section id="settings-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-settings></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-head">
          <div>
            <span class="modal-kicker" data-i18n="settings.kicker">APLIKACJA</span>
            <h2 id="settings-title" data-i18n="settings.title">Ustawienia</h2>
          </div>
          <button id="settings-close" class="icon-btn close-btn" aria-label="Close">×</button>
        </div>

        <div class="settings-list">
          <label class="setting-row">
            <div>
              <strong data-i18n="settings.tray">Zamykaj do zasobnika</strong>
              <small data-i18n="settings.trayHelp">Kliknięcie X ukryje aplikację zamiast ją wyłączać.</small>
            </div>
            <input id="setting-tray" type="checkbox" />
          </label>

          <label class="setting-row">
            <div>
              <strong data-i18n="settings.autostart">Uruchamiaj przy starcie systemu</strong>
              <small data-i18n="settings.autostartHelp">Font Builder uruchomi się automatycznie po zalogowaniu.</small>
            </div>
            <input id="setting-autostart" type="checkbox" />
          </label>

          <label class="setting-row">
            <div>
              <strong data-i18n="settings.cleanup">Czyść pliki tymczasowe przy starcie</strong>
              <small data-i18n="settings.cleanupHelp">Usuwa poprzednie, niezapisane buildy z katalogu tymczasowego.</small>
            </div>
            <input id="setting-cleanup" type="checkbox" />
          </label>

          <label class="setting-row select-row">
            <div>
              <strong data-i18n="settings.mode">Domyślny tryb builda</strong>
              <small data-i18n="settings.modeHelp">AUTO jest zalecane, pozostałe tryby służą głównie do testów.</small>
            </div>
            <select id="setting-mode">
              <option value="auto" data-i18n="settings.modeAuto">AUTO</option>
              <option value="true-variable" data-i18n="settings.modeSmooth">Pełna interpolacja</option>
              <option value="discrete-variable" data-i18n="settings.modeDiscrete">Bezpieczne łączenie</option>
            </select>
          </label>
        </div>

        <div class="modal-footer">
          <span id="settings-message" class="settings-message"></span>
          <button id="settings-save" data-i18n="settings.save">ZAPISZ USTAWIENIA</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
